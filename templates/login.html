<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mail Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { border: none; border-radius: 12px; box-shadow: 0 25px 50px rgba(0,0,0,.4); }
  .brand { font-size: 1.3rem; font-weight: 700; color: #6366f1; letter-spacing: -.5px; }
</style>
</head>
<body>
<div style="width:100%;max-width:380px;padding:1rem">
  <div class="card">
    <div class="card-body p-4">
      <div class="brand mb-4">⬡ Mail Manager</div>
      {% if error %}<div class="alert alert-danger py-2 small">Wrong password.</div>{% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <input type="password" name="password" class="form-control" placeholder="Password" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
